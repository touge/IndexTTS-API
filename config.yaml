# 鏈嶅姟绔缃?
server:
  host: 0.0.0.0
  port: 7002
  reload: false

# API 鎺ュ彛閰嶇疆
api:
  # Bearer Token 楠岃瘉
  # 鍙栨秷娉ㄩ噴鎴栫暀绌哄彲绂佺敤楠岃瘉妯″紡
  # 寤鸿鍦ㄧ敓浜х幆澧冨己鏍￠獙 token
  token: "123456"
  
  # 杈撳嚭鏂囦欢璁剧疆
  output:
    # 瀛樻斁浠诲姟鐨勭洰褰曪紙姣忎釜浠诲姟涓€涓瓙鐩綍锛?
    tasks_dir: "tasks"
    # 鏂囦欢淇濈暀鏃堕棿锛堝皬鏃讹級锛岃秴鏃跺悗鏂囦欢浼氳鑷姩娓呯悊
    retention_hours: 8
    # 娴佸紡涓嬭浇鍚庢槸鍚﹀垹闄ゆ枃浠讹紙寤鸿 true锛?
    delete_after_stream: true
  
  # 鏂囦欢涓婁紶闄愬埗
  upload:
    # 鏂囦欢澶у皬闄愬埗锛堝崟浣嶏細MB锛?
    max_subtitle_audio_size: 1024  # 瀛楀箷闀块煶棰戞枃浠堕檺鍒?(1GB)
    max_reference_audio_size: 300  # 鍙傝€冮煶棰?鐭煶棰戞枃浠堕檺鍒?(300MB)
    max_text_size: 50              # 鏂囨湰鏂囦欢澶у皬闄愬埗 (50MB)
    
    # 鍏佽鐨勬枃浠舵墿灞曞悕
    allowed_audio_extensions:
      - .wav
      - .mp3
      - .flac
      - .ogg
      - .m4a
    allowed_text_extensions:
      - .txt
      - .md

# TTS 妯″瀷璁剧疆
tts:
  # 璺緞璁剧疆
  paths:
    # 妯″瀷鏍圭洰褰曪紙璇ョ洰褰曢€氬父鍖呭惈鎵€鏈夋ā鍨嬫枃浠跺す锛?
    models_root: "models"
  
  # 妯″瀷榛樿璁剧疆锛堣繍琛屾椂锛?
  model:
    runtime_settings:
      use_cuda_kernel: false # 鏄惁浣跨敤 CUDA Kernel
      use_deepspeed: false   # 鏄惁浣跨敤 Deepspeed
      unload_after_gen: true # 鐢熸垚瀹屾瘯鍚庢槸鍚﹂噴鏀炬樉瀛橈紙鑺傜渷鏄惧瓨锛屼絾浼氬鍔犱笅娆＄敓鎴愮瓑寰呮椂闂达級

  # 澶氱増鏈ā鍨嬮厤缃?
  versions:
    "V1.5":
      module: "app.core.indextts.infer"
      class_name: "IndexTTS"
      # 妯″瀷鐩綍锛堝鏋滅敤鎴蜂笉鍙嚜瀹氫箟锛岃涓嶈淇敼锛?
      model_dir: "IndexTTS-1.5"
      config_file: "config.yaml"
      
    "V2.0":
      module: "app.core.indextts.infer_v2"
      class_name: "IndexTTS2"
      # 妯″瀷鐩綍
      model_dir: "IndexTTS-2"
      config_file: "config.yaml"
  
  # 瀛楀箷鐢熸垚璁剧疆
  subtitle:
    # 鏄惁寮€鍚瓧骞曠敓鎴愬姛鑳斤紙榛樿鍏抽棴锛岀敱鐢ㄦ埛閫氳繃 API 鍙傛暟 generate_subtitle 鎺у埗锛?
    enabled: false
    # Whisper 妯″瀷璺緞锛堢浉瀵逛簬 models_root锛?
    whisper_model: "whisper/faster-whisper-large-v2"
    # Whisper 鎺ㄧ悊鍙傛暟
    whisper_config:
      beam_size: 5              # Beam search 鍊嶇巼澶у皬锛屽奖鍝嶈浆褰曞噯纭害
      word_timestamps: true     # 鍚敤璇嶇骇鏃堕棿鎴筹紙蹇呴』涓?true锛?
    # 鏂囨湰瀵归綈璁剧疆
    alignment:
      match_threshold: 75       # 妯＄硦鍖归厤闃堝€?(0-100)锛屼綆浜庢鍊艰涓哄尮閰嶅け璐?
      search_window_multiplier: 3  # 鎼滅储绐楀彛澶у皬鏁帮紝璁＄畻绐楀彛澶у皬 = 鏂囨湰瀛楁暟 脳 鍊嶆暟 + 20绉?

# 鏃ュ織鏂囦欢鍔ㄦ€佹竻鐞嗚缃紙娓呯悊 logs/latest.log锛?
log_cleanup:
  # 妫€鏌ュ畾鏃堕棿闅旓紙鍒嗛挓锛?
  check_interval_minutes: 30
  # latest.log 杈惧埌澶氬ぇ锛圡B锛夋椂杩涜鎵撳寘褰掓。
  max_size_mb: 5
  # 褰掓。鍚?latest.log 淇濈暀鏈€杩戠殑琛屾暟锛? = 瀹屽叏娓呯┖锛?
  keep_lines: 200
  # logs/ 鐩綍涓嬫渶澶氫繚鐣欑殑鍘嗗彶褰掓。鏂囦欢鏁伴噺
  max_archives: 7